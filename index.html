<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Los Roques</title>
<meta name="description" content="A real-time simulation of the Los Roques archipelago, Venezuela, built from satellite data. For a computer with a graphics card.">
<meta name="theme-color" content="#070d18">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23070d18'/%3E%3Cpath d='M10 6c4 1.6 8 1.6 12 0-1.6 4-1.6 8 0 12-4-1.6-8-1.6-12 0 1.6-4 1.6-8 0-12z' fill='%23ffc94a'/%3E%3Cpath d='M3 23c4.5-4 8.5-4 13 0s8.500 4 13 0' fill='none' stroke='%234fd8ff' stroke-width='2.4' stroke-linecap='round' stroke-dasharray='4 3'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/intro.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three-0.186.1/build/three.module.js", "three/addons/": "./vendor/three-0.186.1/addons/" } }
</script>
</head>
<body>
<canvas id="view" tabindex="0" aria-label="3D view of the Los Roques archipelago"></canvas>

<!-- The opening screen (css/intro.css, src/ui/intro.js): the horizon of Los Roques sewn across lelelilo's night.
     The seam is the loading bar; the pillow behind it is the sun coming up. -->
<div id="intro" role="dialog" aria-label="Los Roques: opening">
  <div class="i-stars" aria-hidden="true"></div>
  <div class="i-dawn" aria-hidden="true"></div>
  <div class="i-cloud a" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
  <div class="i-cloud b" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>

  <a class="i-brand" href="https://lelelilo.com" title="A lelelilo project">
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <defs><radialGradient id="i-brand-gold" cx="50%" cy="45%" r="60%"><stop offset="0" stop-color="#ffe39a"/><stop offset="0.7" stop-color="#ffc23a"/><stop offset="1" stop-color="#e09a1a"/></radialGradient></defs>
      <path d="M8 8 C 22 13, 42 13, 56 8 C 51 22, 51 42, 56 56 C 42 51, 22 51, 8 56 C 13 42, 13 22, 8 8 Z" fill="url(#i-brand-gold)" stroke="#b8741a" stroke-width="1.5" stroke-dasharray="3 2.5"/>
      <ellipse cx="24" cy="29" rx="3.2" ry="4" fill="#1a120c"/><ellipse cx="40" cy="29" rx="3.2" ry="4" fill="#1a120c"/>
      <circle cx="23" cy="27.5" r="1" fill="#fff"/><circle cx="39" cy="27.5" r="1" fill="#fff"/>
      <path d="M27 37 Q32 42 37 37" fill="none" stroke="#1a120c" stroke-width="2.2" stroke-linecap="round"/>
    </svg>
    <span>lelelilo</span>
  </a>
  <button id="i-sound" type="button" aria-label="Sound" aria-pressed="true" title="Sound: waves, wind and your steps">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 9h4l5-4v14l-5-4H4z"/>
      <g class="on"><path d="M16 9a4 4 0 0 1 0 6"/><path d="M18.5 6.500a7.500 7.500 0 0 1 0 11"/></g>
      <g class="off"><path d="M16.500 9.500l5 5M21.500 9.500l-5 5"/></g>
    </svg>
  </button>

  <main class="i-stage">
    <p class="i-where">Venezuela · 11°51′ N 66°45′ W</p>
    <h1 class="i-title" aria-label="Los Roques"><span style="--i:0">L</span><span style="--i:1">o</span><span style="--i:2">s</span><span class="gap"></span><span style="--i:3">R</span><span style="--i:4">o</span><span style="--i:5">q</span><span style="--i:6">u</span><span style="--i:7">e</span><span style="--i:8">s</span></h1>

    <svg class="i-scene" viewBox="0 0 1000 330" aria-hidden="true">
      <defs>
        <radialGradient id="i-gold" cx="50%" cy="45%" r="60%"><stop offset="0" stop-color="#ffe39a"/><stop offset="0.7" stop-color="#ffc23a"/><stop offset="1" stop-color="#e09a1a"/></radialGradient>
        <radialGradient id="i-halo"><stop offset="0" stop-color="#ffc94a" stop-opacity="0.42"/><stop offset="0.5" stop-color="#ffc94a" stop-opacity="0.11"/><stop offset="1" stop-color="#ffc94a" stop-opacity="0"/></radialGradient>
        <!-- (The sky: all that is above the seam. The sun rises from behind it.) -->
        <clipPath id="i-sky"><path d="M-80 205 L40 205 C140 157,250 157,350 205 S560 253,660 205 S860 157,960 205 L1080 205 V-140 H-80 Z"/></clipPath>
        <mask id="i-sewn" maskUnits="userSpaceOnUse" x="0" y="110" width="1000" height="190"><path id="i-reveal" d="M40 205 C140 157,250 157,350 205 S560 253,660 205 S860 157,960 205" fill="none" stroke="#fff" stroke-width="30"/></mask>
      </defs>
      <g clip-path="url(#i-sky)">
        <g id="i-sun" transform="translate(500 312)">
          <circle class="halo" r="165" fill="url(#i-halo)"/>
          <circle class="rays" r="92"/>
          <g class="pillow" transform="scale(1.9) translate(-32 -32)">
            <g class="body">
              <path d="M8 8 C 22 13, 42 13, 56 8 C 51 22, 51 42, 56 56 C 42 51, 22 51, 8 56 C 13 42, 13 22, 8 8 Z" fill="url(#i-gold)" stroke="#b8741a" stroke-width="1.5" stroke-dasharray="3 2.500"/>
              <ellipse class="eye" cx="24" cy="29" rx="3.200" ry="4" fill="#1a120c"/><ellipse class="eye" cx="40" cy="29" rx="3.200" ry="4" fill="#1a120c"/>
              <circle class="eye" cx="23" cy="27.500" r="1" fill="#fff"/><circle class="eye" cx="39" cy="27.500" r="1" fill="#fff"/>
              <path class="shut" d="M20.500 29.500 q3.500 3 7 0 M36.500 29.500 q3.500 3 7 0"/>
              <path class="smile" d="M27 37 Q32 42 37 37" fill="none" stroke="#1a120c" stroke-width="2.200" stroke-linecap="round"/>
              <path d="M15 37 l1.200 2.400 2.600 0.400 -1.900 1.800 0.500 2.600 -2.400 -1.300 -2.400 1.300 0.500 -2.600 -1.900 -1.800 2.600 -0.400z" fill="#ff9d00"/>
              <path d="M49 37 l1.200 2.400 2.600 0.400 -1.900 1.800 0.500 2.600 -2.400 -1.300 -2.400 1.300 0.500 -2.600 -1.900 -1.800 2.600 -0.400z" fill="#ff9d00"/>
              <!-- (Loaded: it puts its sunglasses on.) -->
              <g class="shades">
                <path d="M16 27 L9.500 25.200 M48 27 L54.500 25.200 M29.800 27.400 q2.200 -1.700 4.400 0" fill="none" stroke="#1a120c" stroke-width="1.700" stroke-linecap="round"/>
                <rect x="16" y="24.300" width="13.800" height="9.800" rx="3.800" fill="#17100b" stroke="#3a2a14" stroke-width="0.700"/><rect x="34.200" y="24.300" width="13.800" height="9.800" rx="3.800" fill="#17100b" stroke="#3a2a14" stroke-width="0.700"/>
                <path d="M18.600 27 l3.600 -1.300 M36.800 27 l3.600 -1.300" fill="none" stroke="#4fd8ff" stroke-width="1.100" stroke-linecap="round" opacity="0.85"/>
              </g>
            </g>
            <g class="zz"><text x="50" y="12" style="--d:0s">z</text><text x="56" y="6" style="--d:1.200s">z</text><text x="62" y="0" style="--d:2.400s">z</text></g>
          </g>
        </g>
      </g>
      <!-- (Two cays on the swells: a palm, and a beach umbrella.) -->
      <g class="cay"><path class="fill" d="M166 172 Q195 142 224 172"/><path d="M197 158 q-5 -17 3 -33"/><path d="M200 125 q-14 -9 -25 1 M200 125 q-5 -15 -20 -14 M200 125 q9 -14 23 -8 M200 125 q15 -4 23 9"/></g>
      <g class="cay"><path class="fill" d="M782 172 Q810 144 838 172"/><path d="M812 158 l-3 -29"/><path class="fill" d="M790 136 Q807 111 829 130 Z"/></g>
      <g class="birds"><path d="M560 78 q6 -7 12 0 q6 -7 12 0"/><path d="M596 96 q5 -6 10 0 q5 -6 10 0"/></g>
      <path class="swell" d="M112 262 q34 -11 68 0 t68 0 t68 0"/>
      <path class="swell two" d="M650 276 q34 -11 68 0 t68 0 t68 0"/>
      <g class="glitter">
        <path d="M462 264 h76" style="--d:0s"/><path d="M476 276 h50" style="--d:0.500s"/><path d="M456 287 h38" style="--d:1.100s"/><path d="M509 287 h30" style="--d:0.300s"/>
        <path d="M480 298 h42" style="--d:1.600s"/><path d="M468 309 h22" style="--d:0.800s"/><path d="M501 309 h34" style="--d:2s"/><path d="M487 320 h28" style="--d:1.300s"/>
      </g>
      <path id="i-wave" class="chalk" d="M40 205 C140 157,250 157,350 205 S560 253,660 205 S860 157,960 205"/>
      <path class="gold" d="M40 205 C140 157,250 157,350 205 S560 253,660 205 S860 157,960 205" mask="url(#i-sewn)"/>
      <path id="i-thread" class="thread" d="M40 205 C140 157,250 157,350 205 S560 253,660 205 S860 157,960 205"/>
      <g id="i-needle"><path d="M-22 0 L10 -2.200 L16 0 L10 2.200 Z" fill="#fff4d6"/><ellipse cx="-14" cy="0" rx="4" ry="1.400" fill="none" stroke="#070d18" stroke-width="1.400"/></g>
    </svg>

    <div class="i-status" role="status" aria-live="polite">
      <p class="i-line"><span id="i-label">Threading the needle</span><b><span id="i-pct">0</span><small>%</small></b></p>
      <p class="i-tip" id="i-tip"></p>
    </div>
    <div class="i-go" id="i-go" hidden>
      <p class="i-verdict" id="i-verdict"></p>
      <button id="i-enter" type="button"><span id="i-enter-text">Step onto the sand</span><svg viewBox="-24 -6 44 12" aria-hidden="true"><path d="M-22 0 L10 -2.200 L16 0 L10 2.200 Z"/></svg></button>
      <p class="i-keys">or press <kbd>Enter</kbd></p>
    </div>
    <div class="i-note" id="i-note" hidden></div>
  </main>

  <aside class="i-card i-yours" aria-label="Your computer"><h2>Your computer</h2><ul id="i-checks"></ul></aside>
  <aside class="i-card i-asks" aria-label="Recommended"><h2>Recommended</h2><ul id="i-asks"></ul><p id="i-least"></p></aside>
  <p class="i-build" id="i-build"></p>
</div>
<div class="i-rim" id="i-rim" aria-hidden="true"></div>

<div id="ui" hidden></div>
<noscript><p style="position:fixed;inset:auto 0 12% 0;z-index:50;margin:0;text-align:center;color:#fff4d6;font:1rem system-ui,sans-serif">Los Roques is a 3D simulation: it needs JavaScript turned on.</p></noscript>
<script type="module" src="src/main.js"></script>
</body>
</html>
